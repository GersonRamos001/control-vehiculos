spring:
  application:
    name: control-vehiculos

  profiles:
    # Si no se activa otro perfil (spring.profiles.active), se usa dev.
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

app:
  reportes:
    # Separador de las descargas CSV. ';' abre bien en Excel con configuración regional hispana;
    # use ',' si su Excel está en configuración inglesa (si todo queda en una sola columna, cambie este valor).
    separador-csv: ';'
  security:
    # Administrador inicial: solo se usa cuando la tabla de usuarios está vacía (primer arranque). Fuera del perfil dev
    # hay que definirlo con variables de entorno en ese primer arranque; después los usuarios se gestionan en la aplicación.
    usuario: ${APP_SECURITY_USUARIO:}
    password: ${APP_SECURITY_PASSWORD:}
    # Bloqueo de la cuenta tras esta cantidad de contraseñas incorrectas seguidas, durante estos minutos.
    max-intentos-fallidos: 5
    minutos-bloqueo: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
