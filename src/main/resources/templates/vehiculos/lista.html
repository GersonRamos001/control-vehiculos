<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('vehiculos')}"></nav>

<main class="container pb-5">
	<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<h1 class="h3 mb-0">Vehículos</h1>
		<a class="btn btn-success" th:if="${puedeEscribir}" th:href="@{/vehiculos/nuevo}"><i class="bi bi-plus-lg"></i> Registrar vehículo</a>
	</div>

	<th:block th:replace="~{fragments/layout :: mensajes}"></th:block>

	<div class="d-flex align-items-center gap-2 mb-3">
		<span>Mostrar:</span>
		<a class="btn btn-sm" th:classappend="${filtro.name() == 'ACTIVOS'} ? 'btn-success' : 'btn-outline-secondary'"
		   th:href="@{/vehiculos(filtro='ACTIVOS')}">Activos</a>
		<a class="btn btn-sm" th:classappend="${filtro.name() == 'TODOS'} ? 'btn-success' : 'btn-outline-secondary'"
		   th:href="@{/vehiculos(filtro='TODOS')}">Todos</a>
	</div>

	<div class="card shadow-sm">
		<p class="vacio text-center py-5" th:if="${#lists.isEmpty(vehiculos)}">
			<i class="bi bi-inbox fs-2 d-block mb-2"></i>
			No hay vehículos para mostrar.
		</p>

		<div class="table-responsive" th:unless="${#lists.isEmpty(vehiculos)}">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
				<tr>
					<th>Placa</th>
					<th>Código de equipo</th>
					<th>Localidad</th>
					<th>Tipo de uso</th>
					<th>Última rutina</th>
					<th>Estado</th>
					<th th:if="${puedeEscribir}">Acciones</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="v : ${vehiculos}" th:classappend="${!v.activo()} ? 'inactivo'">
					<td><strong th:text="${v.placa()}">ABC-123</strong></td>
					<td th:text="${v.codigoEquipo()}">EQ-001</td>
					<td th:text="${v.localidad()}">Localidad</td>
					<td th:text="${v.tipoUso()}">Operativo</td>
					<td th:text="${v.rutina() != null} ? ${v.rutina()} : '—'">10K</td>
					<td>
						<span class="badge text-bg-success" th:if="${v.activo()}">Activo</span>
						<span class="badge text-bg-secondary" th:unless="${v.activo()}">Inactivo</span>
					</td>
					<td th:if="${puedeEscribir}">
						<div class="d-flex flex-wrap gap-1">
							<a class="btn btn-sm btn-outline-secondary"
							   th:href="@{/vehiculos/{id}/mantenimientos(id=${v.id()})}">Historial</a>
							<a class="btn btn-sm btn-outline-secondary"
							   th:href="@{/vehiculos/{id}/kilometraje(id=${v.id()})}">Kilometraje</a>
							<a class="btn btn-sm btn-outline-secondary" th:if="${v.activo()}"
							   th:href="@{/vehiculos/{id}/mantenimientos/nuevo(id=${v.id()})}">Mantenimiento</a>
							<a class="btn btn-sm btn-outline-secondary" th:if="${v.activo()}"
							   th:href="@{/vehiculos/{id}/editar(id=${v.id()})}"><i class="bi bi-pencil"></i> Editar</a>
							<form th:if="${v.activo()}" th:action="@{/vehiculos/{id}/desactivar(id=${v.id()})}" method="post"
							      onsubmit="return confirm('¿Desactivar este vehículo?');">
								<button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
							</form>
							<form th:unless="${v.activo()}" th:action="@{/vehiculos/{id}/activar(id=${v.id()})}" method="post">
								<button type="submit" class="btn btn-sm btn-outline-success">Activar</button>
							</form>
						</div>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
